<!DOCTYPE html>
<html lang="zh-TW">
<head>

    <title>🍁2026/11東京迪士尼樂園楓葉行</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
:root {
    --bg-color: #FBF7EF;
    --main-pink: #E8C76A;
    --dark-pink: #B74735;
    --main-purple: #526B45;
    --header-purple-light: #F5E8CF;
    --text-color: #493B30;
    --white: #FFFFFF;
    --maple-orange: #D97736;
    --ginkgo-gold: #D5AC38;
    --forest-green: #526B45;
    --cream: #FBF7EF;
    --card-shadow: 0 8px 20px rgba(130, 83, 42, 0.10);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Noto Sans TC', sans-serif; background-color: var(--bg-color); color: var(--text-color); overflow-x: hidden; }

.cl-item-ghost { opacity: 0.5; background: #F8EBC6 !important; border: 2px dashed var(--ginkgo-gold) !important; }
.cl-item { cursor: grab; user-select: none; }
.cl-item:active { cursor: grabbing; }

@keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

header {
    background: linear-gradient(135deg, #F5E8CF 0%, #F8E7D5 55%, #EED4B4 100%);
    text-align: center; padding: 12px 10px; border-bottom: 2px solid var(--ginkgo-gold);
    position: sticky; top: 0; z-index: 200; backdrop-filter: blur(8px);
}
header h1 { font-size: 1.3rem; color: var(--dark-pink); letter-spacing: 1.5px; font-weight: 800; line-height: 1.4; }
.time-box {
    background: rgba(255,255,255,0.7); margin: 5px auto 0; padding: 3px 12px;
    border-radius: 12px; font-size: 0.7rem; color: var(--forest-green);
    font-weight: bold; border: 1px solid rgba(82, 107, 69, 0.2); 
    width: fit-content; backdrop-filter: blur(4px); box-shadow: 0 2px 8px rgba(130, 83, 42, 0.08);
}
#real-date { margin-bottom: 2px; }
#realtime-clock { display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; }
.clock-item { display: flex; align-items: center; gap: 4px; }

.tab-content { display: none; padding: 15px 15px 100px 15px; min-height: 80vh; }
.tab-content.active { display: block; animation: fadeInUp 0.35s ease-out; }

/* 行程日期列 */
.date-nav {
    display: flex; overflow-x: auto; gap: 10px; margin-bottom: 15px;
    padding: 10px 5px; position: sticky; top: 78px; background-color: var(--bg-color); z-index: 100;
    box-shadow: 0 4px 10px -5px rgba(179, 157, 219, 0.1);
}
.date-nav::-webkit-scrollbar { display: none; }
.date-btn {
    flex: 0 0 85px; height: 85px; background: var(--white); border: 2px solid #E8D8B9;
    border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--forest-green); transition: 0.3s;
}
.date-btn.active { background: var(--dark-pink); color: var(--white); border-color: var(--dark-pink); }
.date-btn .date-day { font-size: 0.85rem; font-weight: 700; opacity: 0.9; margin-bottom: 2px; }
.date-btn .date-num { font-size: 1.1rem; font-weight: 700; }
.date-btn .date-week { font-size: 0.8rem; }

#itinerary-list { display: flex; flex-direction: column; gap: 12px; padding-bottom: 80px; }
.itin-card {
    display: flex; background: var(--white); border-radius: 18px;
    box-shadow: var(--card-shadow); overflow: hidden; position: relative;
    cursor: pointer; min-height: 90px; border: 1px solid rgba(213, 172, 56, 0.12);
}
.itin-time {
    background: linear-gradient(to bottom, #F5E8CF, #FFFFFF);
    color: var(--forest-green); font-family: 'JetBrains Mono', monospace; 
    font-size: 1.1rem; font-weight: 900;
    padding: 12px 5px; width: 95px; flex-shrink: 0; 
    display: flex; flex-direction: column; align-items: center; justify-content: center; 
    text-align: center; border-right: 1.5px dashed var(--main-pink);
    line-height: 1;
}
.time-sep { display: block; margin: 2px 0; font-size: 0.8rem; opacity: 0.3; font-weight: normal; }
.itin-content { padding: 12px 15px; padding-right: 50px; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
.itin-loc { font-size: 1.05rem; font-weight: 700; color: var(--dark-pink); }
.itin-detail-row { display: flex; align-items: flex-start; gap: 6px; font-size: 0.82rem; color: var(--text-color); opacity: 0.9; white-space: pre-wrap; }
.itin-notes-row { display: flex; align-items: flex-start; gap: 6px; font-size: 0.8rem; color: #8d6e63; margin-top: 2px; white-space: pre-wrap; }
.itin-action-group { position: absolute; right: 8px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
.itin-action-btn { background: #fff; color: var(--dark-pink); border: 1px solid #F0E1CC; width: 32px; height: 32px; border-radius: 50%; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
.itin-map-btn { color: #4285F4; border-color: #e8f0fe; }

/* 彈窗樣式 */
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1500; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
.overlay.active { display: flex; }
.detail-card { width: 100%; max-width: 350px; background: white; border-radius: 30px; overflow: hidden; position: relative; animation: fadeInUp 0.3s ease-out; }
.detail-header { background: linear-gradient(135deg, #B74735, #D97736); padding: 40px 20px; text-align: center; color: white; }
.detail-header .time { font-family: 'JetBrains Mono'; font-size: 1.2rem; font-weight: 700; margin-bottom: 5px; }
.detail-header .loc { font-size: 1.3rem; font-weight: 800; }
.detail-body { padding: 30px 25px; }
.detail-row { display: flex; gap: 15px; margin-bottom: 20px; }
.detail-icon { font-size: 1.5rem; flex-shrink: 0; }
.detail-text-label { font-size: 0.75rem; color: #aaa; display: block; margin-bottom: 4px; }
.detail-text-content { font-size: 1rem; color: var(--text-color); font-weight: 500; white-space: pre-wrap; }
.detail-close { position: absolute; top: 15px; right: 15px; width: 35px; height: 35px; border-radius: 50%; background: rgba(255,255,255,0.2); color: white; border: none; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }

.modal-content { background: white; width: 100%; max-width: 380px; border-radius: 25px; padding: 22px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); animation: fadeInUp 0.3s ease-out; position: relative; max-height: 90vh; overflow-y: auto; }
.modal-title { font-size: 1.2rem; font-weight: 800; color: var(--dark-pink); margin-bottom: 18px; text-align: center; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 0.75rem; color: #8d6e63; margin-bottom: 5px; font-weight: bold; }
.form-group input, .form-group textarea { width: 100%; border: 2px solid #E8D8B9; border-radius: 12px; padding: 10px 12px; font-family: inherit; font-size: 0.95rem; outline: none; transition: 0.3s; }
.form-group input:focus, .form-group textarea:focus { border-color: var(--ginkgo-gold); background: #FFFCF5; }

.time-range { display: flex; align-items: center; gap: 10px; }
.time-range input { flex: 1; text-align: center; }
.modal-btns { display: flex; gap: 10px; margin-top: 18px; }
.modal-btns button { flex: 1; padding: 12px; border-radius: 50px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
.modal-btns button:active { transform: scale(0.95); }
.btn-cancel { background: #eee; color: #777; }
.btn-save { background: var(--dark-pink); color: white; box-shadow: 0 4px 10px rgba(183,71,53,0.22); }
.btn-add-inline { flex: 0 0 80px; background: var(--forest-green); color: white; border: none; border-radius: 12px; font-weight: 700; font-size: 0.9rem; cursor: pointer; box-shadow: 0 4px 10px rgba(82,107,69,0.2); transition: 0.2s; }
.btn-delete-itin-top { position: absolute; top: 15px; left: 15px; width: 35px; height: 35px; border-radius: 50%; background: #fff5f5; color: #e53935; border: 1.5px solid #ffcdd2; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; }

.card { background: var(--white); padding: 18px; border-radius: 20px; box-shadow: var(--card-shadow); }
.input-group { margin-bottom: 15px; position: relative; }
.input-group label { display: block; font-size: 0.8rem; color: #a1887f; margin-bottom: 5px; }
.input-group input { width: 100%; padding: 12px; border: 2px solid #f0f0f0; border-radius: 12px; font-size: 1.3rem; outline: none; font-weight: 700; background: #fafafa; }
.currency-unit { position: absolute; right: 12px; top: 38px; font-weight: 700; color: #ddd; }
.jp-menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
.menu-btn { background: var(--white); border: 2.5px solid #F0E2C8; padding: 20px 10px; border-radius: 22px; text-align: center; font-weight: 700; color: var(--forest-green); box-shadow: 0 5px 15px rgba(130,83,42,0.08); transition: 0.2s; }
.menu-btn:active { transform: scale(0.96); }
#fixed-back-container { position: fixed; top: 110px; left: 0; right: 0; padding: 12px 15px; background-color: var(--bg-color); z-index: 180; display: none; }
.back-btn-styled { background: var(--dark-pink); color: white; padding: 8px 20px; border-radius: 50px; font-weight: bold; border: none; font-size: 0.9rem; cursor: pointer; }
.phrase-list { display: none; padding-top: 65px; }
.phrase-list.active { display: block; animation: fadeInUp 0.3s; }
.phrase-item { background: white; padding: 16px; border-radius: 18px; margin-bottom: 12px; border: 1.5px solid #eee; border-left: 6px solid var(--ginkgo-gold); cursor: pointer; }
.phrase-item b { display: block; color: var(--dark-pink); font-size: 1rem; margin-bottom: 4px; }
.phrase-item .romaji { display: block; color: var(--forest-green); font-size: 0.75rem; font-style: italic; margin-top: 2px; }

/* 旅伴 Chip 列 */
.who-container { display: flex; align-items: center; gap: 8px; overflow-x: auto; padding-bottom: 5px; }
.who-chip { position: relative; flex: 0 0 auto; padding: 7px 15px; border-radius: 50px; background: #f5f5f5; border: 2px solid transparent; font-size: 0.8rem; color: #888; font-weight: 700; cursor: pointer; }
.who-chip.active { background: #F7E6D7; border-color: var(--dark-pink); color: var(--dark-pink); }

.checklist-tabs { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; align-items: center; }
.cl-tab-btn { flex: 0 0 auto; padding: 8px 16px; border-radius: 50px; border: 2px solid #E8D8B9; background: white; color: var(--forest-green); font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: 0.2s; }
.cl-tab-btn.active { background: var(--dark-pink); color: white; border-color: var(--dark-pink); }
.cl-tab-manage { font-size: 0.7rem; padding: 6px 12px; background: #eee; border: none; border-radius: 50px; color: #777; cursor: pointer; font-weight: bold; flex-shrink: 0; }

/* 清單卡片核心樣式 */
.shop-item-card {
    background: white; border-radius: 18px; padding: 12px 14px; margin-bottom: 11px;
    box-shadow: 0 4px 12px rgba(130, 83, 42, 0.06); border: 1.5px solid #E8D8B9;
    display: flex; flex-direction: column; gap: 6px; transition: 0.2s;
}
.shop-item-card:active { border-color: var(--dark-pink); }
.shop-item-card.done { opacity: 0.55; }
.shop-item-card.done .shop-title-text { text-decoration: line-through; }

.shop-card-main-row { display: flex; align-items: center; gap: 8px; width: 100%; }

.cl-check {
    width: 32px; height: 32px; border-radius: 50%; border: 2.5px solid var(--forest-green);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    cursor: pointer; font-weight: bold; color: white; background: transparent; padding: 0;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent; transition: 0.15s;
    outline: none; -webkit-appearance: none;
}
.shop-item-card.done .cl-check { background: var(--forest-green); }

.shop-title-and-thumbs { flex: 1; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; cursor: pointer; }
.shop-title-text { font-size: 1rem; font-weight: 700; color: var(--dark-pink); word-break: break-word; line-height: 1.3; }

.shop-thumbs-wrap { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; }
.shop-thumb {
    width: 42px; height: 42px; border-radius: 10px; object-fit: cover;
    border: 1.5px solid var(--ginkgo-gold); cursor: zoom-in; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    transition: transform 0.15s; flex-shrink: 0; touch-action: manipulation;
}
.shop-thumb:active { transform: scale(0.92); }

.shop-notes-row { font-size: 0.82rem; color: #8d6e63; padding-left: 40px; display: flex; align-items: flex-start; gap: 5px; white-space: pre-wrap; line-height: 1.4; }
.cl-who-badge { font-size: 0.7rem; color: #795A22; background: #F8EBC6; padding: 3px 8px; border-radius: 10px; flex-shrink: 0; font-weight: bold; }

.manage-btn-group { display: flex; align-items: center; gap: 4px; }
.manage-icon-btn {
    width: 30px; height: 30px; border-radius: 8px; border: 1.5px solid #E8D8B9;
    background: #FFFCF5; color: var(--forest-green); font-size: 0.8rem; font-weight: bold;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    transition: 0.15s; touch-action: manipulation; padding: 0; line-height: 1;
}
.manage-icon-btn:hover { background: #F5E8CF; }
.manage-icon-btn:disabled { opacity: 0.25; cursor: default; background: #f5f5f5; border-color: #eee; color: #ccc; }
.manage-icon-btn.btn-del-small { color: #e53935; border-color: #ffcdd2; background: #fff5f5; }

.btn-card-del { color: #ccc; border: none; background: none; font-size: 1.15rem; padding: 4px; cursor: pointer; touch-action: manipulation; }
.btn-card-del:hover { color: #e53935; }

/* 圖片多選上傳面板 */
.multi-img-upload-box { background: #FFFCF5; border: 2px dashed #D5AC38; border-radius: 15px; padding: 12px; margin-bottom: 14px; }
.multi-img-btns { display: flex; gap: 8px; margin-top: 6px; }
.btn-upload-action { flex: 1; padding: 8px; background: white; border: 1.5px solid #D5AC38; color: #526B45; border-radius: 10px; font-size: 0.8rem; font-weight: bold; cursor: pointer; }
.multi-img-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.multi-img-item { position: relative; width: 62px; height: 62px; border-radius: 10px; overflow: hidden; border: 1.5px solid #D5AC38; box-shadow: 0 2px 5px rgba(0,0,0,0.08); flex-shrink: 0; }
.multi-img-item img { width: 100%; height: 100%; object-fit: cover; }
.btn-remove-single-img { position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border-radius: 50%; background: #e53935; color: white; border: none; font-size: 11px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }

/* 全螢幕圖片燈箱 */
#cl-lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 3000; align-items: center; justify-content: center; padding: 15px; }
#cl-lightbox.active { display: flex; animation: fadeInUp 0.25s; }
.lightbox-box { max-width: 92vw; max-height: 88vh; display: flex; flex-direction: column; align-items: center; background: #FBF7EF; border-radius: 20px; overflow: hidden; border: 2px solid #D5AC38; }
.lightbox-img { max-width: 88vw; max-height: 72vh; object-fit: contain; padding: 8px; }
.lightbox-caption { padding: 8px 15px; font-weight: bold; color: var(--dark-pink); text-align: center; }

/* 底部導覽列（4個項目：行程、清單、匯率、日文） */
.bottom-nav { position: fixed; bottom: 12px; left: 12px; right: 12px; background: rgba(255,255,255,0.96); display: flex; height: 64px; z-index: 1000; border-radius: 30px; box-shadow: 0 10px 25px rgba(130, 83, 42, 0.16); backdrop-filter: blur(10px); }
.nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.75rem; color: #bbb; text-decoration: none; transition: 0.2s; }
.nav-tab.active { color: var(--dark-pink); font-weight: 800; transform: scale(1.05); }
.nav-tab .nav-icon { font-size: 1.4rem; margin-bottom: 2px; }

.fab { position: fixed; bottom: 90px; right: 20px; width: 58px; height: 58px; background: var(--dark-pink); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; box-shadow: 0 8px 20px rgba(183, 71, 53, 0.28); z-index: 500; border: none; cursor: pointer; }
#fs-overlay { display: none; position: fixed; inset: 0; background: var(--bg-color); z-index: 2000; flex-direction: column; justify-content: center; align-items: center; padding: 30px; text-align: center; }
#fs-overlay.active { display: flex; }
#fs-jp { color: var(--forest-green) !important; }
#fs-ch { color: var(--dark-pink) !important; }

/* 匯率快速選擇與速查表 */
.quick-btn-group { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.quick-chip {
    padding: 5px 12px; background: #FFFCF5; border: 1.5px solid #E8D8B9;
    border-radius: 50px; font-size: 0.8rem; font-weight: 700; color: var(--forest-green);
    cursor: pointer; transition: 0.15s; touch-action: manipulation;
}
.quick-chip:active { transform: scale(0.95); background: #F5E8CF; }
.quick-chip.add-chip { border-color: var(--ginkgo-gold); color: var(--dark-pink); background: #FFF8EB; }
.quick-chip.reset-chip { border-color: #ffcdd2; color: #e53935; background: #fff5f5; }

.quick-sheet-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px;
}
.quick-sheet-item {
    background: white; border: 1.5px solid #E8D8B9; border-radius: 12px;
    padding: 8px 10px; font-size: 0.82rem; display: flex; justify-content: space-between;
    align-items: center; cursor: pointer; transition: 0.15s; box-shadow: 0 2px 6px rgba(130,83,42,0.04);
}
.quick-sheet-item:active { transform: scale(0.97); border-color: var(--dark-pink); background: #FFFCF5; }

<body>

    <header>
        <h1>🍁2026/11🍁<br>東京迪士尼楓葉行</h1>
        <div class="time-box">
            <div id="real-date">即時時間</div>
            <div id="realtime-clock">
                <div class="clock-item">🇹🇼 <span id="clock-tw">--:--:--</span></div>
                <div class="clock-item" style="border-left: 1px solid #ddd; padding-left: 6px;">🇯🇵 <span id="clock-jp">--:--:--</span></div>
            </div>
        </div>
    </header>

    <button id="fab-btn" class="fab" onclick="handleFabClick()">＋</button>

    <!-- 行程日期新增/編輯 Modal -->
    <div id="day-modal" class="overlay">
        <div class="modal-content">
            <button id="day-delete-btn" class="btn-delete-itin-top" style="display:none;" onclick="deleteTripDay()">🗑️</button>
            <button class="detail-close" style="background:#F5E8CF; color:var(--dark-pink); top:15px; right:15px;" onclick="closeModal('day-modal')">✕</button>
            <div class="modal-title" id="day-modal-title">新增旅行日期</div>
            <input type="hidden" id="day-edit-id">
            <div class="form-group">
                <label>選擇日期 <span style="color:#B74735">*</span></label>
                <input type="date" id="day-date-input">
            </div>
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeModal('day-modal')">取消</button>
                <button class="btn-save" onclick="saveTripDay()">儲存日期</button>
            </div>
        </div>
    </div>

    <!-- 行程詳情查看 Modal -->
    <div id="detail-overlay" class="overlay" onclick="closeItinDetail()">
        <div class="detail-card" onclick="event.stopPropagation()">
            <button class="detail-close" onclick="closeItinDetail()">✕</button>
            <div class="detail-header">
                <div class="time" id="dt-time">--:--</div>
                <div class="loc" id="dt-loc">地點名稱 </div>
            </div>
            <div class="detail-body">
                <div class="detail-row">
                    <div class="detail-icon">🚋</div>
                    <div>
                        <span class="detail-text-label">交通方式</span>
                        <div class="detail-text-content" id="dt-trans">無設定</div>
                    </div>
                </div>
                <div class="detail-row">
                    <div class="detail-icon">📝</div>
                    <div>
                        <span class="detail-text-label">備註細節</span>
                        <div class="detail-text-content" id="dt-notes">尚無備註</div>
                    </div>
                </div>
                <div class="detail-row" id="dt-imgs-row" style="display:none;">
                    <div class="detail-icon">🖼️</div>
                    <div style="flex:1;">
                        <span class="detail-text-label">圖片附件</span>
                        <div id="dt-imgs-grid" style="display:flex; flex-wrap:wrap; gap:8px; margin-top:4px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 行程編輯/新增彈窗 -->
    <div id="itin-modal" class="overlay">
        <div class="modal-content">
            <button id="btn-delete-itin" class="btn-delete-itin-top" style="display:none;" onclick="delItinFromModal()">🗑️</button>
            <button class="detail-close" style="background:#F5E8CF; color:var(--dark-pink); top:15px; right:15px;" onclick="closeModal('itin-modal')">✕</button>
            <div class="modal-title" id="modal-title">新增行程</div>
            <input type="hidden" id="edit-id">
            <div class="form-group">
                <label>時間範圍 (選填)</label>
                <div class="time-range">
                    <input type="time" id="form-time-start">
                    <span style="color:#ddd">至</span>
                    <input type="time" id="form-time-end">
                </div>
            </div>
            <div class="form-group">
                <label>行程 / 地點名稱  <span style="color:#B74735">*</span></label>
                <input type="text" id="form-loc" placeholder="(必填) 要去哪兒？">
            </div>
            <div class="form-group">
                <label>Google Map 關鍵字或網站連結 (選填)</label>
                <input type="text" id="form-map-query" placeholder="(選填) 輸入地點名稱或網址...">
            </div>
            <div class="form-group">
                <label>交通方式 / 細節 (選填)</label>
                <textarea id="form-trans" rows="3" placeholder="(選填) 迪士尼、迪士尼、迪士尼..."></textarea>
            </div>
            <div class="form-group">
                <label>備註 / 提醒 (選填)</label>
                <textarea id="form-notes" rows="3" placeholder="(選填) 妳說說，我不聽..."></textarea>
            </div>

            <!-- 多張圖片上傳／拍照／網址 -->
            <div class="multi-img-upload-box">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <label style="font-size: 0.78rem; font-weight: bold; color: var(--dark-pink);">📸 圖片 (可放多張圖片)</label>
                    <span id="itin-img-count-badge" style="font-size: 0.7rem; color: #795A22; font-weight: bold;">0 張</span>
                </div>

                <div class="multi-img-btns">
                    <button type="button" class="btn-upload-action" onclick="document.getElementById('itin-multi-file-input').click()">📷 圖片</button>
                    <button type="button" class="btn-upload-action" onclick="toggleItinUrlField()">🔗 貼上網址</button>
                </div>
                
                <input type="file" id="itin-multi-file-input" accept="image/*" multiple style="display:none;" onchange="handleItinMultiFilesSelect(event)">
                
                <div id="itin-url-container" style="display: none; margin-top: 8px;">
                    <input type="url" id="itin-img-url-input" placeholder="https://... 貼上圖片網址" style="padding: 8px; font-size: 0.8rem; border-radius: 8px; border: 1px solid #D5AC38;">
                    <button type="button" onclick="applyItinSingleImageUrl()" style="width: 100%; margin-top: 5px; padding: 6px; background: var(--forest-green); color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 0.8rem; cursor: pointer;">➕ 加入此圖片</button>
                </div>

                <!-- 多圖縮圖預覽列 -->
                <div id="itin-images-preview-grid" class="multi-img-grid"></div>
                <div style="font-size: 0.68rem; color: #795A22; margin-top: 6px; text-align: center;">☁️ 圖片將自動壓縮並上傳</div>
            </div>

            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeModal('itin-modal')">取消</button>
                <button class="btn-save" onclick="saveItin()">儲存行程</button>
            </div>
        </div>
    </div>

    <!-- 1. 行程頁面 -->
    <div id="page-itinerary" class="tab-content active">
        <div class="date-nav">
            <div id="date-buttons" style="display:flex; gap:10px;"></div>
            <button class="date-btn" style="flex:0 0 85px; width:85px; height:85px; border: 2px dashed #D5AC38; background: #FFFCF5; color: var(--forest-green); cursor: pointer;" onclick="openDayModal()">
                <span style="font-size: 1.35rem; margin-bottom: 2px;">⭐</span>
                <span style="font-size: 0.8rem; font-weight: 700;">新增日期</span>
            </button>
        </div>
        <div id="itinerary-list"></div>
    </div>

    <!-- 2. 清單頁面 -->
    <div id="page-checklist" class="tab-content">
        <!-- 旅伴 selector 區域 -->
        <div style="background: white; padding: 12px; border-radius: 18px; margin-bottom: 12px; border: 1.5px solid #E8D8B9; box-shadow: 0 4px 10px rgba(130,83,42,0.05);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                <label style="font-size: 0.8rem; font-weight: bold; color: var(--forest-green);">👤 選擇登記旅伴</label>
                <button type="button" class="cl-tab-manage" onclick="openWhoManageModal()">⚙️ 旅伴管理</button>
            </div>
            <div id="who-selector" class="who-container"></div>
        </div>

        <!-- 清單分類 Tab 列 -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <div id="cl-tabs" class="checklist-tabs" style="margin-bottom: 0; flex: 1; margin-right: 8px;"></div>
            <button type="button" class="cl-tab-manage" onclick="openCatManageModal()">⚙️ 分類管理</button>
        </div>
        
        <!-- 項目列表 -->
        <div id="cl-items-list" style="padding-bottom: 80px;"></div>
    </div>

    <!-- 3. 匯率頁面 -->
    <div id="page-exchange" class="tab-content">
        <div class="card">
            <div class="input-group">
                <label>🇯🇵 日幣 JPY</label>
                <input type="number" id="jpy-val" placeholder="0" oninput="convert('jpy')">
                <span class="currency-unit">円</span>
            </div>

            <!-- 快捷選取日幣金額與累加按鈕 -->
                <div style="font-size: 0.78rem; color: var(--dark-pink); font-weight: bold; margin-top: 12px; margin-bottom: 6px;">➕ 快速加總金額</div>
                <div class="quick-btn-group">
                    <button type="button" class="quick-chip add-chip" onclick="addJpyQuick(1)">+1円</button>
                    <button type="button" class="quick-chip add-chip" onclick="addJpyQuick(10)">+10円</button>
                    <button type="button" class="quick-chip add-chip" onclick="addJpyQuick(100)">+100円</button>
                    <button type="button" class="quick-chip add-chip" onclick="addJpyQuick(1000)">+1,000円</button>
                    <button type="button" class="quick-chip add-chip" onclick="addJpyQuick(10000)">+10,000円</button>
                    <button type="button" class="quick-chip reset-chip" onclick="setJpyQuick(0)">🧹 歸零</button>
            </div>

            <div class="input-group" style="margin-top: 16px;"><label>🇹🇼 台幣 TWD</label><input type="number" id="twd-val" placeholder="0" oninput="convert('twd')"><span class="currency-unit">元</span></div>
        </div>

        <div style="margin-top: 16px; background: #fdf2f4; border: 1.5px dashed var(--dark-pink); padding: 16px; border-radius: 18px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                <label style="font-size: 0.8rem; color: var(--dark-pink); font-weight: bold;">🪄 自訂匯率 (1 JPY = ? TWD)</label>
                <button type="button" id="btn-fetch-bot-rate" onclick="fetchBankOfTaiwanRate()" style="font-size: 0.72rem; padding: 6px 12px; background: var(--dark-pink); color: white; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 4px; box-shadow: 0 2px 6px rgba(183,71,53,0.2);">
                    🔄 抓取台銀日幣現金賣出"參考"價
                </button>
            </div>
            <input type="number" id="base-rate" value="0.21" step="0.0001" style="width: 100%; border: none; background: transparent; font-size: 1.35rem; font-weight: 800; outline: none; color: var(--dark-pink);" oninput="convert('jpy')">
            <div id="rate-update-time" style="font-size: 0.72rem; color: #8d6e63; margin-top: 4px; font-weight: 500;">預設匯率：0.2100</div>

    <script>
        const SUPABASE_URL = 'https://zyyjuzysjjdnuqwhummh.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5eWp1enlzampkbnVxd2h1bW1oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5OTU3MzEsImV4cCI6MjEwODU3MTczMX0.4d7Id1Zz4fac3q7V6ENNlV957fxaCyuQ8Y_8elGAV3M';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function sbFetch(path, options = {}) {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
                    ...options,
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': (options.method === 'POST' || options.method === 'PATCH') ? 'return=representation' : '',
                        ...(options.headers || {})
                    }
                });
                if (!res.ok) {
                    const text = await res.text();
                    try { return JSON.parse(text); } catch(e) { return []; }
                }
                const text = await res.text();
                return text ? JSON.parse(text) : [];
            } catch (e) {
                console.warn('API Connection fallback:', e.message || e);
                return [];
            }
        }

        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        // --- 旅行日期管理 ---
        let tripDays = [];
        let currentDay = null;

        function renderTripDays() {
            const container = document.getElementById('date-buttons');
            if (!container) return;
            const chineseWeekdays = ['日', '一', '二', '三', '四', '五', '六'];
            const japaneseWeekdays = ['日', '月', '火', '水', '木', '金', '土'];

            container.innerHTML = tripDays.map((day, index) => {
                const [year, monthValue, dayValue] = (day.trip_date || '2026-11-01').split('-').map(Number);
                const date = new Date(year, monthValue - 1, dayValue);
                const month = date.getMonth() + 1;
                const dayNumber = date.getDate();
                const weekday = date.getDay();
                const weekdayText = `（${chineseWeekdays[weekday]}、${japaneseWeekdays[weekday]}）`;

                return `
                    <div style="position:relative; flex:0 0 85px;">
                        <button class="date-btn ${day.day_id === currentDay ? 'active' : ''}" style="width:85px;" onclick="switchDay(${day.day_id})">
                            <span class="date-day">第${index + 1}日</span>
                            <span class="date-num">${month}/${dayNumber}</span>
                            <span class="date-week">${weekdayText}</span>
                        </button>
                        <button title="編輯日期" onclick="openDayModal(${day.day_id})" style="position:absolute; right:-3px; top:-5px; border:0; border-radius:50%; background:#F5E8CF; width:26px; height:26px; cursor:pointer;">✏️</button>
                    </div>
                `;
            }).join('');
        }

        async function refreshTripDays() {
            const data = await sbFetch('trip_days?select=*&order=trip_date.asc');
            if (Array.isArray(data) && data.length > 0) {
                tripDays = data;
            } else if (tripDays.length === 0) {
                tripDays = [{ day_id: 1, trip_date: '2026-11-01' }];
            }
            if (!tripDays.some(day => day.day_id === currentDay)) {
                currentDay = tripDays[0]?.day_id ?? 1;
            }
            renderTripDays();
            renderItinerary();
        }

        function openDayModal(dayId = null) {
            const day = tripDays.find(d => d.day_id === dayId);
            document.getElementById('day-edit-id').value = day ? day.day_id : '';
            document.getElementById('day-date-input').value = day?.trip_date || '';
            document.getElementById('day-modal-title').innerText = day ? '修改旅行日期' : '新增旅行日期';
            document.getElementById('day-delete-btn').style.display = day ? 'block' : 'none';
            document.getElementById('day-modal').classList.add('active');
        }

        async function saveTripDay() {
            const id = document.getElementById('day-edit-id').value;
            const date = document.getElementById('day-date-input').value;
            if (!date) { alert('請選擇旅行日期。'); return; }
            if (tripDays.some(d => d.trip_date === date && String(d.day_id) !== String(id))) {
                alert('這個日期已經存在，請勿重複新增。'); return;
            }
            const path = id ? `trip_days?day_id=eq.${id}` : 'trip_days';
            const result = await sbFetch(path, { method: id ? 'PATCH' : 'POST', body: JSON.stringify({ trip_date: date }) });
            if (id) currentDay = Number(id); else currentDay = result[0]?.day_id ?? null;
            closeModal('day-modal');
            await refreshTripDays();
            await refreshItinerary();
        }

        async function deleteTripDay() {
            const id = Number(document.getElementById('day-edit-id').value);
            if (!id || !(await customConfirm('確定刪除這個旅行日期？'))) return;
            await sbFetch(`trip_days?day_id=eq.${id}`, { method: 'DELETE' });
            currentDay = null;
            closeModal('day-modal');
            await refreshTripDays();
            await refreshItinerary();
        }

        // --- 行程功能 ---
        let allItinerary = [];
        async function refreshItinerary() {
            const data = await sbFetch('itinerary_items?select=*,map_query&order=time.asc');
            allItinerary = Array.isArray(data) ? data : [];
            renderItinerary();
        }

        function formatItinTime(timeStr) {
            if (!timeStr || timeStr.trim() === '' || timeStr === '|') return '<span>--:--</span>';
            const parts = timeStr.split(/[-|]/).map(s => s.trim());
            return `<span>${parts[0] || ""}</span><span class="time-sep">|</span><span>${parts[1] || ""}</span>`;
        }

        function goToMap(query) {
            if (!query) return;
            const q = query.trim();
            if (q.startsWith('http')) window.open(q, '_blank');
            else window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`, '_blank');
        }

        let currentItinModalImages = [];

        async function handleItinMultiFilesSelect(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            for (let i = 0; i < files.length; i++) {
                try {
                    const dataUrl = await compressImage(files[i]);
                    currentItinModalImages.push({ url: dataUrl, isLocal: true });
                } catch (e) {
                    console.error('圖片壓縮失敗', e);
                }
            }
            renderItinModalImagesPreview();
            event.target.value = '';
        }

        function toggleItinUrlField() {
            const el = document.getElementById('itin-url-container');
            if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
        }

        function applyItinSingleImageUrl() {
            const urlInput = document.getElementById('itin-img-url-input');
            const url = urlInput ? urlInput.value.trim() : '';
            if (url) {
                currentItinModalImages.push({ url, isLocal: false });
                if (urlInput) urlInput.value = '';
                const el = document.getElementById('itin-url-container');
                if (el) el.style.display = 'none';
                renderItinModalImagesPreview();
            }
        }

        function removeItinModalImageAt(index) {
            currentItinModalImages.splice(index, 1);
            renderItinModalImagesPreview();
        }

        function renderItinModalImagesPreview() {
            const grid = document.getElementById('itin-images-preview-grid');
            const badge = document.getElementById('itin-img-count-badge');
            if (badge) badge.innerText = `${currentItinModalImages.length} 張圖片`;

            if (grid) {
                grid.innerHTML = currentItinModalImages.map((item, idx) => `
                    <div class="multi-img-item">
                        <img src="${item.url}" alt="縮圖">
                        <button type="button" class="btn-remove-single-img" onclick="removeItinModalImageAt(${idx})">✕</button>
                    </div>
                `).join('');
            }
        }

        function renderItinerary() {
            const list = document.getElementById('itinerary-list');
            if (!list) return;
            const items = allItinerary.filter(i => i.day_id === currentDay);
            if (items.length === 0) {
                list.innerHTML = `<div style="text-align: center; color: #b39ddb; padding: 40px 20px; font-weight: 700; border: 2px dashed #f3e5f5; border-radius: 22px;">~快想想吧~<br>點擊 ＋ 號新增！</div>`;
                return;
            }
            list.innerHTML = items.map(i => {
                const parsed = parseItemContent(i.notes || '', i.image_url);
                const noteText = [parsed.name, parsed.notes].filter(Boolean).join('\n');
                return `
                    <div class="itin-card" onclick='openItinDetail(${JSON.stringify(i).replace(/'/g, "&#39;")})'>
                        <div class="itin-time">${formatItinTime(i.time)}</div>
                        <div class="itin-content">
                            <div class="itin-loc">${i.location}</div>
                            ${i.transport ? `<div class="itin-detail-row"><span>🚋 ${i.transport}</span></div>` : ''}
                            ${noteText ? `<div class="itin-notes-row"><span>📝 ${noteText}</span></div>` : ''}
                            ${parsed.images && parsed.images.length > 0 ? `
                                <div class="shop-thumbs-wrap" style="margin-top: 4px;" onclick="event.stopPropagation()">
                                    ${parsed.images.map(img => `
                                        <img src="${img}" class="shop-thumb" onclick="event.stopPropagation(); openLightbox('${img}', '${(i.location || '').replace(/'/g, "\\'")}')">
                                    `).join('')}
                                </div>
                            ` : ''}
                        </div>
                        <div class="itin-action-group">
                            <button class="itin-action-btn" onclick='event.stopPropagation(); openItinModal(${JSON.stringify(i).replace(/'/g, "&#39;")})'>✏️</button>
                            ${(i.map_query && i.map_query.trim() !== '') ? `<button class="itin-action-btn itin-map-btn" onclick="event.stopPropagation(); goToMap(\`${i.map_query}\`)">📍</button>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openItinModal(item = null) {
            const modal = document.getElementById('itin-modal');
            const delBtn = document.getElementById('btn-delete-itin');
            if (item) {
                document.getElementById('modal-title').innerText = '修改行程';
                document.getElementById('edit-id').value = item.id;
                const parts = (item.time || '').split(/[-|]/).map(s => s.trim());
                document.getElementById('form-time-start').value = parts[0] || '';
                document.getElementById('form-time-end').value = parts[1] || '';
                document.getElementById('form-loc').value = item.location || '';
                document.getElementById('form-map-query').value = item.map_query || '';
                document.getElementById('form-trans').value = item.transport || '';
                
                const parsed = parseItemContent(item.notes || '', item.image_url);
                const noteText = [parsed.name, parsed.notes].filter(Boolean).join('\n');
                document.getElementById('form-notes').value = noteText;
                currentItinModalImages = parsed.images.map(url => ({ url, isLocal: false }));
                if (delBtn) delBtn.style.display = 'flex';
            } else {
                document.getElementById('modal-title').innerText = '新增行程';
                document.getElementById('edit-id').value = '';
                document.getElementById('form-time-start').value = '';
                document.getElementById('form-time-end').value = '';
                document.getElementById('form-loc').value = '';
                document.getElementById('form-map-query').value = '';

        async function saveItin() {
            const id = document.getElementById('edit-id').value;
            const start = document.getElementById('form-time-start').value;
            const end = document.getElementById('form-time-end').value;
            const location = document.getElementById('form-loc').value;
            const map_query = document.getElementById('form-map-query').value.trim();
            const transport = document.getElementById('form-trans').value;
            const notesInput = document.getElementById('form-notes').value.trim();
            if (!location) return;

            const saveBtn = document.querySelector('#itin-modal .btn-save');
            const hasLocalImages = currentItinModalImages.some(i => i.isLocal);
            if (hasLocalImages && saveBtn) {
                saveBtn.innerText = '上傳中...';
                saveBtn.disabled = true;
            }

            const finalImageUrls = [];
            for (let i = 0; i < currentItinModalImages.length; i++) {
                const item = currentItinModalImages[i];
                if (item.isLocal && item.url.startsWith('data:')) {
                    try {
                        const uploadedUrl = await uploadSingleToStorage(item.url);
                        finalImageUrls.push(uploadedUrl);
                    } catch (err) {
                        console.warn('Storage 上傳失敗，降級保留', err);
                        finalImageUrls.push(item.url);
                    }
                } else {
                    finalImageUrls.push(item.url);
                }
            }

            if (saveBtn) saveBtn.innerText = '儲存中...';

            let finalNotes = notesInput;
            if (finalImageUrls.length > 0) {
                finalNotes += (finalNotes ? '\n' : '') + `<!--IMGS:${JSON.stringify(finalImageUrls)}-->`;
            }

            const combinedTime = `${start}|${end}`;
            const body = { day_id: currentDay, time: combinedTime, location, map_query: map_query || null, transport, notes: finalNotes };

            try {
                if (id) await sbFetch(`itinerary_items?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify(body) });
                else await sbFetch('itinerary_items', { method: 'POST', body: JSON.stringify(body) });
                closeModal('itin-modal');
                refreshItinerary();
            } catch (e) {
                alert('儲存失敗，請確認網路連線');
            } finally {
                if (saveBtn) {
                    saveBtn.innerText = '儲存行程';
                    saveBtn.disabled = false;
                }
            }
        }

        async function fetchBankOfTaiwanRate() {
            const btn = document.getElementById('btn-fetch-bot-rate');
            const rateInput = document.getElementById('base-rate');
            const timeEl = document.getElementById('rate-update-time');
            
            if (btn) btn.innerText = '⏳ 抓取中...';

            const fetchWithTimeout = (url, timeoutMs = 1500) => {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), timeoutMs);
                return fetch(url, { signal: controller.signal })
                    .then(res => { clearTimeout(timer); return res; })
                    .catch(err => { clearTimeout(timer); throw err; });
            };

            const parseRateFromCsv = (text) => {
                const lines = text.split('\n');
                for (let line of lines) {
                    if (line.includes('JPY') || line.includes('日圓') || line.includes('日幣')) {
                        const matches = line.match(/0\.\d{4}/g);
                        if (matches && matches.length >= 2) {
                            const cashSellRate = parseFloat(matches[1]);
                            if (!isNaN(cashSellRate) && cashSellRate > 0.15 && cashSellRate < 0.4) {
                                return cashSellRate.toFixed(4);
                            }
                        }
                    }
                }
                return null;
            };

            const botCsvUrl = 'https://rate.bot.com.tw/xrt/flcsv/0/day?lang=zh-TW';
            const sources = [
                fetchWithTimeout('https://open.er-api.com/v6/latest/JPY', 1200).then(async r => {
                    if (!r.ok) throw new Error('API 失敗');
                    const d = await r.json();
                    if (d && d.rates && d.rates.TWD) return d.rates.TWD.toFixed(4);
                    throw new Error('格式錯誤');
                }),
                fetchWithTimeout(`https://api.allorigins.win/raw?url=${encodeURIComponent(botCsvUrl)}`, 1800).then(async r => {
                    if (!r.ok) throw new Error('代理失敗');
                    const text = await r.text();
                    const rate = parseRateFromCsv(text);
                    if (rate) return rate;
                    throw new Error('解析 CSV 失敗');
                }),
                fetchWithTimeout(`https://corsproxy.io/?${encodeURIComponent(botCsvUrl)}`, 1800).then(async r => {
                    if (!r.ok) throw new Error('代理失敗');
                    const text = await r.text();
                    const rate = parseRateFromCsv(text);
                    if (rate) return rate;
                    throw new Error('解析 CSV 失敗');
                })
            ];

            try {
                const rateStr = await Promise.any(sources);
                if (rateStr && rateInput) {
                    rateInput.value = rateStr;
                    const nowStr = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
                    if (timeEl) timeEl.innerText = `台銀日幣現金賣出"參考"價：${rateStr} (${nowStr})`;
                    convert('jpy');
                    if (btn) btn.innerText = '✅ 抓取成功';
                    setTimeout(() => { if (btn) btn.innerText = '🔄 抓取台銀日幣現金賣出"參考"價'; }, 2000);
                    return;
                }
            } catch (err) {
                console.warn('匯率抓取超時或連線失敗', err);
            }

            if (btn) btn.innerText = '🔄 抓取台銀日幣現金賣出"參考"價';
            alert('無法連線抓取最新匯率，請檢查網路連線或直接手動輸入金額。');
        }

        function convert(type) {
            const rate = parseFloat(document.getElementById('base-rate').value) || 0.21;
            const twd = document.getElementById('twd-val'), jpy = document.getElementById('jpy-val');
            if (type === 'jpy') twd.value = jpy.value ? (parseFloat(jpy.value) * rate).toFixed(2) : '';
            else jpy.value = twd.value ? (parseFloat(twd.value) / rate).toFixed(0) : '';
            updateExchangeQuickSheet();
        }

        function setJpyQuick(amount) {
            const jpyInput = document.getElementById('jpy-val');
            if (!jpyInput) return;
            if (amount === 0) {
                jpyInput.value = '';
            } else {
                jpyInput.value = amount;
            }
            convert('jpy');
        }

        function addJpyQuick(amount) {
            const jpyInput = document.getElementById('jpy-val');
            if (!jpyInput) return;
            const current = parseFloat(jpyInput.value) || 0;
            jpyInput.value = current + amount;
            convert('jpy');
        }

        function updateExchangeQuickSheet() {
            const rate = parseFloat(document.getElementById('base-rate').value) || 0.21;
            const sheetEl = document.getElementById('exchange-quick-sheet');
            if (!sheetEl) return;
            const amounts = [100, 500, 1000, 2000, 5000, 10000, 20000, 50000];
            sheetEl.innerHTML = amounts.map(jpy => {
                const twd = Math.round(jpy * rate);
                return `
                    <div class="quick-sheet-item" onclick="setJpyQuick(${jpy})">
                        <span style="font-weight:700; color:var(--dark-pink);">${jpy.toLocaleString()} 円</span>
                        <span style="font-weight:900; color:var(--forest-green);">≈ NT$ ${twd.toLocaleString()}</span>
                    </div>
                `;
            }).join('');
        }

        function parseItemContent(rawText, explicitImg) {
            let text = rawText || '';
            let notes = '';
            let images = [];

            const noteMatch = text.match(/<!--NOTES:([\s\S]*?)-->/);
            if (noteMatch) {
                notes = noteMatch[1].trim();
                text = text.replace(noteMatch[0], '').trim();
            }

            const multiImgMatch = text.match(/<!--IMGS:([\s\S]*?)-->/);
            if (multiImgMatch) {
                try {
                    const parsedImgs = JSON.parse(multiImgMatch[1]);
                    if (Array.isArray(parsedImgs)) images = parsedImgs;
                } catch(e) {}
                text = text.replace(multiImgMatch[0], '').trim();
            }

            const singleImgMatch = text.match(/<!--IMG:([\s\S]*?)-->/);
            if (singleImgMatch) {
                const singleUrl = singleImgMatch[1].trim();
                if (singleUrl && !images.includes(singleUrl)) images.push(singleUrl);
                text = text.replace(singleImgMatch[0], '').trim();
            }

            if (explicitImg && explicitImg.trim() && !images.includes(explicitImg.trim())) {
                images.push(explicitImg.trim());
            }

            return { name: text, notes, images };
        }

        function dataURLtoBlob(dataurl) {
            const arr = dataurl.split(',');
            const mime = arr[0].match(/:(.*?);/)[1] || 'image/jpeg';
            const bstr = atob(arr[1]);
            let n = bstr.length;
            const u8arr = new Uint8Array(n);
            while (n--) {
                u8arr[n] = bstr.charCodeAt(n);
            }
            return new Blob([u8arr], { type: mime });
        }

        function compressImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onerror = reject;
                reader.onload = (e) => {
                    const img = new Image();
                    img.onerror = reject;
                    img.onload = () => {
                        let w = img.width, h = img.height;
                        const maxDim = 850;
                        if (w > maxDim || h > maxDim) {
                            if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
                            else { w = Math.round((w * maxDim) / h); h = maxDim; }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.8));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function renderSingleShoppingCard(i, index, totalCount) {

                <div class="shop-thumbs-wrap">
                    ${parsed.images.map(img => `
                        <img src="${img}" class="shop-thumb" onclick="event.stopPropagation(); openLightbox('${img}', '${safeName}')" title="點擊放大檢視">
                    `).join('')}
                </div>
            ` : '';

            const notesHtml = parsed.notes ? `
                <div class="shop-notes-row">
                    <span>📝</span>
                    <span>${parsed.notes}</span>
                </div>
            ` : '';

            let displayWho = i.who;
            if (!displayWho || displayWho === '沒有人' || displayWho === '未指派') {
                displayWho = currentWho || (membersData[0]?.name || '全員');
            }

            return `
                <div class="shop-item-card ${i.done ? 'done' : ''}" data-id="${i.id}">
                    <div class="shop-card-main-row">
                        <button type="button" class="cl-check" 
                                onclick="event.stopPropagation(); toggleItem(${i.id}, ${i.done})"
                                ontouchstart="event.stopPropagation();"
                                title="標記完成狀態">
                            ${i.done ? '✓' : ''}
                        </button>
                        
                        <div class="shop-title-and-thumbs" onclick='openClDetail(${safeItem})'>
                            <span class="shop-title-text">${parsed.name}</span>
                            ${thumbsHtml}
                        </div>

                        <span class="cl-who-badge">${displayWho}</span>

                        <button type="button" class="itin-action-btn" onclick='event.stopPropagation(); openClItemModal(${safeItem}, "${safeCategory}")' title="編輯">✏️</button>
                    </div>
                    ${notesHtml}
                </div>
            `;
        }

        function openClDetail(item) {
            const parsed = parseItemContent(item.text, item.image_url);
            let displayWho = item.who;
            if (!displayWho || displayWho === '沒有人' || displayWho === '未指派') {
                displayWho = currentWho || (membersData[0]?.name || '全員');
            }
            document.getElementById('cl-dt-who').innerText = `👤 登記旅伴：${displayWho}`;
            document.getElementById('cl-dt-name').innerText = parsed.name || '無名稱';
            document.getElementById('cl-dt-cat').innerText = item.category || currentCat || '清單';
            document.getElementById('cl-dt-notes').innerText = parsed.notes || '尚無備註';

            const imgsRow = document.getElementById('cl-dt-imgs-row');
            const imgsGrid = document.getElementById('cl-dt-imgs-grid');
            if (parsed.images && parsed.images.length > 0) {
                if (imgsRow) imgsRow.style.display = 'flex';
                if (imgsGrid) {
                    imgsGrid.innerHTML = parsed.images.map(img => `
                        <img src="${img}" class="shop-thumb" style="width: 54px; height: 54px;" onclick="openLightbox('${img}', '${(parsed.name || '').replace(/'/g, "\\'")}')">
                    `).join('');
                }
            } else {
                if (imgsRow) imgsRow.style.display = 'none';
                if (imgsGrid) imgsGrid.innerHTML = '';
            }

            document.getElementById('cl-detail-overlay').classList.add('active');
        }

        function closeClDetail() {
            document.getElementById('cl-detail-overlay').classList.remove('active');
        }

        async function delClItemFromModal() {
            const id = document.getElementById('cl-edit-id').value;
            if (id && await customConfirm('確定刪除此清單項目？')) {
                await sbFetch(`checklist_items?id=eq.${id}`, { method: 'DELETE' });
                closeModal('cl-item-modal');
                await refreshChecklist();
            }
        }

        async function saveChecklistOrder() {
            const listDiv = document.getElementById('cl-items-list');
            const items = listDiv.querySelectorAll('.shop-item-card');
            const updates = Array.from(items).map((el, index) => {
                const id = el.getAttribute('data-id');
                return sbFetch(`checklist_items?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify({ sort_order: index }) });
            });
            await Promise.all(updates);
        }

        function openClItemModal(item = null, defaultCat = null) {
            const modal = document.getElementById('cl-item-modal');
            const delBtn = document.getElementById('btn-delete-cl-item');
            const nameInput = document.getElementById('cl-name-input');
            const notesInput = document.getElementById('cl-notes-input');
            const editId = document.getElementById('cl-edit-id');
            const editCat = document.getElementById('cl-edit-category');
            const titleEl = document.getElementById('cl-modal-title');
            
            currentModalImages = [];

            let targetCategory = defaultCat || currentCat;
            if (!targetCategory && categoriesData.length > 0) targetCategory = categoriesData[0].name;
            editCat.value = targetCategory;

            if (item) {
                titleEl.innerText = `修改${item.category || '清單'}項目`;
                editId.value = item.id;
                editCat.value = item.category || targetCategory;
                if (delBtn) delBtn.style.display = 'flex';
                
                let whoVal = item.who;
                if (!whoVal || whoVal === '沒有人' || whoVal === '未指派') whoVal = currentWho || (membersData[0]?.name || '');
                modalSelectedWho = whoVal;

                const parsed = parseItemContent(item.text, item.image_url);
                nameInput.value = parsed.name;
                notesInput.value = parsed.notes;

                currentModalImages = parsed.images.map(url => ({ url, isLocal: false }));
            } else {
                titleEl.innerText = `新增${targetCategory || '清單'}項目`;
                editId.value = '';
                nameInput.value = '';
                notesInput.value = '';
                if (delBtn) delBtn.style.display = 'none';
                modalSelectedWho = currentWho || (membersData[0]?.name || '');
            }

            renderModalWhoChips();
            renderModalImagesPreview();
            document.getElementById('cl-url-container').style.display = 'none';
            modal.classList.add('active');
        }

        function renderModalWhoChips() {
            const container = document.getElementById('modal-who-chips');
            container.innerHTML = membersData.map(m => `
                <div class="who-chip ${m.name === modalSelectedWho ? 'active' : ''}" style="padding: 5px 12px; font-size: 0.75rem;" onclick="setModalWho('${m.name}')">${m.name}</div>
            `).join('');
        }

        function setModalWho(name) {
            modalSelectedWho = name;
            renderModalWhoChips();
        }

        async function saveClItem() {
            const id = document.getElementById('cl-edit-id').value;
            const targetCategory = document.getElementById('cl-edit-category').value || currentCat;
            const name = document.getElementById('cl-name-input').value.trim();
            const notes = document.getElementById('cl-notes-input').value.trim();
            const saveBtn = document.getElementById('btn-save-cl-item');

            if (!name) { alert('請輸入物品名稱！'); return; }

            const finalImageUrls = [];
            const hasLocalImages = currentModalImages.some(i => i.isLocal);

            if (hasLocalImages && saveBtn) {
                saveBtn.innerText = '上傳中...';
                saveBtn.disabled = true;
            }

            for (let i = 0; i < currentModalImages.length; i++) {
                const item = currentModalImages[i];
                if (item.isLocal && item.url.startsWith('data:')) {
                    try {
                        const uploadedUrl = await uploadSingleToStorage(item.url);
                        finalImageUrls.push(uploadedUrl);
                    } catch (err) {
                        console.warn('Storage 上傳失敗，降級保留', err);
                        finalImageUrls.push(item.url);
                    }
                } else {
                    finalImageUrls.push(item.url);
                }
            }

            if (saveBtn) {
                saveBtn.innerText = '儲存中...';
            }

            let finalText = name;
            if (notes) {
                finalText += `\n<!--NOTES:${notes}-->`;
            }
            if (finalImageUrls.length > 0) {
                finalText += `\n<!--IMGS:${JSON.stringify(finalImageUrls)}-->`;
            }

            let assignee = modalSelectedWho || currentWho || (membersData[0]?.name || '');
            if (assignee === '沒有人' || assignee === '未指派') {
                assignee = currentWho || (membersData[0]?.name || '');
            }

            try {
                if (id) {
                    await sbFetch(`checklist_items?id=eq.${id}`, {
                        method: 'PATCH',
                        body: JSON.stringify({ text: finalText, who: assignee, category: targetCategory })
                    });
                } else {
                    const catItems = allItems.filter(i => i.category === targetCategory);
                    const maxSort = catItems.length > 0 ? Math.max(...catItems.map(i => i.sort_order || 0)) : -1;
                    await sbFetch('checklist_items', {
                        method: 'POST',
                        body: JSON.stringify({
                            category: targetCategory,
                            text: finalText,
                            done: false,
                            who: assignee,
                            sort_order: maxSort + 1
                        })
                    });
                }
                closeModal('cl-item-modal');
                await refreshChecklist();
            } catch (e) {
                alert('儲存失敗，請確認網路連線');
            } finally {
                if (saveBtn) {
                    saveBtn.innerText = '儲存';
                    saveBtn.disabled = false;
                }
            }
        }

        async function toggleItem(id, currentDone) {
            await sbFetch(`checklist_items?id=eq.${id}`, {
                method: 'PATCH',
                body: JSON.stringify({ done: !currentDone })
            });
            await refreshChecklist();
        }


        // --- 全域分頁與初始化 ---
        function switchTab(tabId, el) {
            document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(nt => nt.classList.remove('active'));
            document.getElementById('page-' + tabId).classList.add('active');
            if (el) el.classList.add('active');
            localStorage.setItem('trip_last_tab', tabId);

            const fab = document.getElementById('fab-btn');
            if (tabId === 'itinerary' || tabId === 'checklist') {
                fab.style.display = 'flex';
            } else {
                fab.style.display = 'none';
            }

            if (tabId === 'japanese') {
                renderJapaneseTab();
            } else if (tabId === 'exchange') {
                updateExchangeQuickSheet();
            }
        }

        function handleFabClick() {
            const activeTab = document.querySelector('.nav-tab.active')?.getAttribute('onclick') || '';
            if (activeTab.includes('itinerary')) {
                openItinModal();
            } else if (activeTab.includes('checklist')) {
                openClItemModal();
            }
        }

        function updateClocks() {
            const now = new Date();
            const options = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            
            const twTime = new Intl.DateTimeFormat('zh-TW', { ...options, timeZone: 'Asia/Taipei' }).format(now);
            const jpTime = new Intl.DateTimeFormat('zh-TW', { ...options, timeZone: 'Asia/Tokyo' }).format(now);
            
            const twEl = document.getElementById('clock-tw');
            const jpEl = document.getElementById('clock-jp');
            if (twEl) twEl.innerText = twTime;
            if (jpEl) jpEl.innerText = jpTime;

            const dateOptions = { year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short' };
            const dateStr = new Intl.DateTimeFormat('zh-TW', dateOptions).format(now);
            const dateEl = document.getElementById('real-date');
            if (dateEl) dateEl.innerText = dateStr;
        }

        window.addEventListener('DOMContentLoaded', async () => {
            setInterval(updateClocks, 1000);
            updateClocks();

            loadJapaneseCategories();

            await refreshTripDays();
            await refreshItinerary();
            await refreshMembers();
            await refreshCategories();
            await refreshChecklist();

            updateExchangeQuickSheet();

            const lastTab = localStorage.getItem('trip_last_tab') || 'itinerary';
            const tabBtn = document.querySelector(`.nav-tab[onclick*="${lastTab}"]`);
            switchTab(lastTab, tabBtn);
        });
    </script>
</body>
